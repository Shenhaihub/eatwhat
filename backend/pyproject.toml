[project]
name = "eatwhat-backend"
version = "0.1.0"
description = "EatWhat 后端：模块化单体，P1 骨架阶段"
readme = "README.md"
authors = [
    { name = "yu xuan mo", email = "2581910881@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.0",
    "email-validator>=2.2.0,<3",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

# Mypy 工程约定（与 P1/P2 保持一致）：对生产代码 app/ 跑 strict，对 tests/ 放松未类型化函数（no-untyped-def / no-untyped-call）
[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disable_error_code = ["no-untyped-def", "no-untyped-call", "unused-ignore", "name-defined", "type-arg", "no-untyped-call", "call-overload", "index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
