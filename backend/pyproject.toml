[project]
name = "eatwhat-backend"
version = "0.1.0"
description = "EatWhat 后端：模块化单体，P1 骨架阶段"
readme = "README.md"
authors = [
    { name = "yu xuan mo", email = "2581910881@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cachetools>=7.1.7",
    "cryptography>=50.0.0",
    "email-validator>=2.2.0,<3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

# 显式锁定 lint 规则集，保持与 P1~P5 "ruff 0 warnings" 通过时的规则一致：
#   - select = E/F/I/UP/RUF ：这是 Ruff 历史版本的默认规则集（pycodestyle/pyflakes/isort/pyupgrade/ruff 内置），
#     不会把 FastAPI 官方推荐的 `Depends()` 默认参数当成 B008，也不会启用 tryceratops。
#   - ignore 解释：
#     * TRY（tryceratops）：TRY002 禁止直接 raise Exception，与项目既有风格不一致；
#     * RUF001/RUF002/RUF003（ambiguous-unicode-character-*）：Ruff 0.16+ 默认新增，
#       但项目大量中文注释/文档使用全角逗号/引号，误报极多（>4k 条），无实际代码质量收益；
#     * E501（line-too-long）：P1~P5 时代大量 docstring/注释/URL 超过 120 字符，
#       之前也未对这条规则严格执行，且硬拆中文 docstring 会降低可读性。
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["TRY", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
# scripts/encrypt_ai_key.py：需要先 sys.path.insert(0, BACKEND_ROOT) 才能 import app.core，是脚本的标准写法。
"scripts/encrypt_ai_key.py" = ["E402"]
# tests/test_poi.py：测试分多个 section（单元测试 / API 契约测试 / AutoFailover），
# 为了让每个 section 的 import 和用例紧贴在一起而放在中间，是 P1~P5 时代就存在的风格。
"tests/test_poi.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = true

# Mypy 工程约定（与 P1/P2 保持一致）：对生产代码 app/ 跑 strict，对 tests/ 放松未类型化函数（no-untyped-def / no-untyped-call）
[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disable_error_code = ["no-untyped-def", "no-untyped-call", "unused-ignore", "name-defined", "type-arg", "no-untyped-call", "call-overload", "index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "fakeredis>=2.37.0",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
