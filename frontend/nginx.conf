# EatWhat 前端 Nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
# 目的：
#   · 80 端口提供静态 SPA（/usr/share/nginx/html = vite build 产物）
#   · 所有找不到的路径 → /index.html（BrowserRouter fallback）
#   · /api/* 反代到 FastAPI（compose 服务名 backend:8000，保留原 /api 前缀）

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 推荐加上：gzip 打开，减小 JS 包体积
    gzip            on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/manifest+json
        image/svg+xml;

    # ------------------------------
    # /api/* → 反代到后端
    # ------------------------------
    location /api/ {
        # proxy_pass 结尾没有 URI（没有 /xxx）→ 原样保留请求路径（含 /api/）
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        # FastAPI 的 request_id/cors 中间件要求原 host 透传
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 让浏览器能拿到后端响应的 X-Request-ID
        add_header         Access-Control-Expose-Headers "X-Request-ID" always;

        # 反代超时：AI 调用最多等 8s（后端自己也有 httpx timeout=8），这里稍放宽
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_connect_timeout 3s;

        # 后端挂了时不要给浏览器 nginx 502 空体，至少返回一条 JSON（方便前端 ApiError 解析）
        error_page 502 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 502 '{"error":{"code":"BACKEND_UNAVAILABLE","message":"后端服务暂时不可用，请稍后重试"},"request_id":"nginx-502"}';
    }

    # ------------------------------
    # 静态资源 + SPA fallback
    # ------------------------------
    # vite 构建的资源（assets/*）有 hash，强缓存
    location ~ ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # favicon 等根静态
    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA 兜底：任何其他路径返回 index.html，让 React Router 接管
    location / {
        try_files $uri $uri/ /index.html;
    }
}
